name: CI Report

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cloc lcov

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: stable

      - name: Flutter pub get
        run: flutter pub get

      - name: Run flutter analyze (non-fatal)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Run tests with coverage
        run: |
          flutter test --coverage || true
          if [ -f coverage/lcov.info ]; then genhtml coverage/lcov.info -o coverage/html || true; fi

      - name: Run cloc summary
        run: cloc --json . > cloc.json || true

      - name: Produce combined report
        run: |
          echo "=== flutter analyze (stdout) ===" > analysis-report.txt
          flutter analyze --no-fatal-infos --no-fatal-warnings >> analysis-report.txt || true
          echo "" >> analysis-report.txt
          echo "=== cloc (json) ===" >> analysis-report.txt
          cat cloc.json >> analysis-report.txt || true
          echo "" >> analysis-report.txt
          echo "coverage present: $( [ -f coverage/lcov.info ] && echo yes || echo no )" >> analysis-report.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ci-report
          path: |
            analysis-report.txt
            cloc.json
            coverage/lcov.info
            coverage/html
